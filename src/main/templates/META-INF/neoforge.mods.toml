modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# ---- 前置 ----

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# LDLib2 —— UI 基建
[[dependencies.${mod_id}]]
modId = "ldlib2"
type = "required"
versionRange = "[${ldlib2_version},)"
ordering = "AFTER"
side = "BOTH"

# NekoJS —— 脚本运行时
[[dependencies.${mod_id}]]
modId = "nekojs"
type = "required"
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "BOTH"

# Graal —— NekoJS 的运行时前置（modId 是 graalmc，不是 graal）
[[dependencies.${mod_id}]]
modId = "graalmc"
type = "required"
versionRange = "${graal_version_range}"
ordering = "NONE"
side = "BOTH"
