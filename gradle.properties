org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存关闭：ModDevGradle 在配置期读取环境（与 NekoJS 平台的取舍一致）
org.gradle.configuration-cache=false

# ---- Mod 元信息 ----
mod_id=nekoldlib
mod_name=NekoLDLib
mod_license=LGPL-3.0
mod_version=0.1.0
mod_group_id=com.tkisor.nekoldlib
mod_authors=AnNingUI
mod_description=NekoJS x LDLib2 bridge: declarative JSX UI driven from NekoJS scripts, backed by LDLib2's UI, RPC and sync stack.

# ---- 目标平台 (NeoForge 26.1.2) ----
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.100
neo_version_range=[26.1.0.8-beta,)
loader_version_range=[4,)

# ---- 依赖版本 ----
# LDLib2：maven.firstdark.dev/snapshots，与本地 LDLib2 仓库 26.1 分支 (v26.1.2.41) 对齐。
# 注意 artifact 名用的是 MC 短版本 "26.1"，而 minecraft_version 是 "26.1.2" —— 两者不同。
ldlib2_mc_short=26.1
ldlib2_version=26.1.2.41
# NekoJS：暂无 maven 发布，开发期用本地构建产物（见 build.gradle）
nekojs_version=1.1.0-preview3
# Graal 前置（NekoJS 的必需前置，modId = graalmc）。
# 这个是 curse.maven 的文件 id，同时也是 compileOnly 依赖的版本号。
graal_version=8456810
graal_version_range=[25.0.1,)

# ---- 开发用 ----
# runClientAuto 自动进入的单人存档名。
# 放这里而不是命令行 -P：带空格的属性值从 shell 传进 gradlew.bat 会踩坑
# （bash 路径截断 / PowerShell 把值当任务名），写属性文件最省事。
quickPlayWorld=New World
